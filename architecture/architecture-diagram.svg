.t{font:700 25px Arial,sans-serif;fill:#15253d}.sub{font:15px Arial,sans-serif;fill:#53677e}.label{font:700 16px Arial,sans-serif;fill:#1e334b}.small{font:13px Arial,sans-serif;fill:#4a5c72}.box{fill:#fff;stroke:#a7b8ca;stroke-width:2;rx:12}.azure{fill:#eef6ff;stroke:#79a8d6;stroke-width:2;rx:18}.ci{fill:#f5efff;stroke:#a38cc8;stroke-width:2;rx:12}.sec{fill:#ecf9f2;stroke:#76b794;stroke-width:2;rx:12}.arr{fill:none;stroke:#607b98;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#7b91a5;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#607b98"/></marker></defs>
