<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">NovaPredict Azure staging architecture</title><desc id="desc">Cloudflare routes browsers to an Azure Container Apps frontend. The frontend routes requests to an internal backend. The backend and background worker use private PostgreSQL and managed Redis. A migration job runs separately. GitHub Actions publishes images to Azure Container Registry and manages reviewed staging deployments. Managed identities access Key Vault; workloads emit logs and telemetry.</desc>
